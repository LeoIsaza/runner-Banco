##==============================================================
## CONFIGURACION DEL GENERADOR DE FEATURES KARATE
##==============================================================

##--- RUTAS ---
# Ruta absoluta al proyecto Karate destino donde se crearan los archivos
# Ej: /Users/usuario/mi-proyecto-karate/src/test/java
karate.project.root=

# (Legado) Ruta de archivos/carpetas para procesar tests de Azure
pathRelativeFileOrFolderProcess=

##--- IDENTIFICACION DEL SERVICIO ---
# Nombre del namespace/carpeta raiz para agrupar el servicio: por ejemplo "baas", "obapis", "abono", etc.
namespace=baas

# Tipo de API: auto | obapi | services
# auto: se detecta por la URL (obapi en el host => obapi, resto => services)
api.type=auto

# Nombre a forzar para el endpoint/operationId (opcional).
# Si se deja vacio, se deriva automaticamente del ultimo segmento de la URL.
namespace.operation=

##--- CURL ---
# Pegar aqui el cURL completo del endpoint a testear (headers + body reales)
curl=

##--- SWAGGER / OPENAPI (opcional) ---
# Ruta local a un archivo OpenAPI v3 (JSON) para afinar tipos y campos requeridos.
# Si se deja vacio, se intenta swaggerAutoDiscover (ver abajo); si eso tampoco
# encuentra nada, el generador infiere todo solo a partir del cURL (default).
swaggerFile=

# Si no hay swaggerFile, por defecto SI intenta descubrir el swagger por red:
# hace GET al host del cURL sobre rutas comunes (/v3/api-docs, /swagger.json, etc.)
# Poner en false si no se quiere que el generador salga a la red al correr.
swaggerAutoDiscover=true

##--- AZURE DEVOPS (opcional, flujo legado de creacion de casos) ---
azureUser=
azurePass=
azureUrlCreateIssue=https://TU-DOMINIO-AZURE/rest/api/2/issue/
azureUrlTransitionIssue=https://TU-DOMINIO-AZURE/rest/api/2/issue/{issueKey}/transitions
azureTransitionId=21
azureBrowse=https://TU-DOMINIO-AZURE/browse/
azureMock=true
customField_10506=10957
customField_10507=10959
customField_11105=11411
customLabels=
customPriority=10005
systemKey=
artefactId=

##--- TIMEOUT ---
connection.timeout=15000
request.timeout=15000
read.timeout=15000
